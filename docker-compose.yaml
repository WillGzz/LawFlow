services:

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  arcadedb:
    image: arcadedata/arcadedb:latest
    container_name: arcadedb
    ports:
      - "2480:2480"
    environment:
      arcadedb.server.rootPassword: ${ARCADEDB_PASSWORD}
      JAVA_TOOL_OPTIONS: "-Djava.rmi.server.hostname=arcadedb -Dcom.sun.jndi.rmiURLParsing=legacy"
    volumes:
      - arcadedb_data:/home/arcadedb/databases

  # ----------------------------------------------------------------------------
  # FLOW 1 — ETL PIPELINE
  # Airflow orchestrates the entire ETL pipeline via the lawflow_pipeline DAG.
  # Runs daily at 9am Mon-Fri — health checks, ingestion, transformation,
  # and storage verification all triggered in sequence by the DAG.
  # Docker socket allows Airflow to exec into the lawflow container.
  # ----------------------------------------------------------------------------

  airflow:
    image: apache/airflow:2.8.0
    container_name: airflow
    depends_on:
      kafka:
        condition: service_healthy
      qdrant:
        condition: service_started
      arcadedb:
        condition: service_started
      lawflow:
        condition: service_started
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      PYTHONPATH: /opt/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/orchestration/dags
      DOCKER_API_VERSION: "1.52"
    volumes:
      - .:/opt/airflow
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    command: standalone
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # lawflow container — runs producer.py and transformation.py
  # triggered by Airflow via docker exec lawflow python <script>
  lawflow:
      build:
        context: .
        dockerfile: Dockerfile.etl
      container_name: lawflow
      depends_on:
        kafka:
          condition: service_healthy
        qdrant:
          condition: service_started
        arcadedb:
          condition: service_started
      environment:
        PYTHONPATH: /app
      volumes:
        - .:/app
      env_file:
        - .env
      ports:
        - "4040:4040"  #spark UI 
      command: tail -f /dev/null # keep container running to allow Airflow to exec into it and run ETL scripts

  # ----------------------------------------------------------------------------
  # FLOW 2 — QUERY / RETRIEVAL PIPELINE
  # Always-on, independent of Airflow.
  # FastAPI serves the chat UI, runs LangChain agent,
  # queries Qdrant and ArcadeDB, calls Claude API.
  # ----------------------------------------------------------------------------

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: fastapi
    depends_on:
      qdrant:
        condition: service_started
      arcadedb:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  qdrant_data:
  arcadedb_data: